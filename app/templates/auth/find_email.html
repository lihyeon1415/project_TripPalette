{% extends "base.html" %}

{% block title %}이메일 찾기 | TripPalette{% endblock %}

{% block content %}
<div class="page-section">
    <div class="container">
        <h1 class="page-title">이메일 찾기</h1>

        <div class="content">
            <p>가입할 때 사용한 정보를 입력해주세요.</p>

           <form method="post" action="{{ url_for('auth.find_email') }}">
    <div class="form-group">
        <label for="name">이름</label>
        <input
            type="text"
            id="name"
            name="name"
            value="{{ form_data.get('name', '') }}"
            placeholder="이름을 입력해주세요"
            autocomplete="name"
            required
        >
    </div>

    <div class="form-group">
        <label for="phone">휴대폰 번호</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            value="{{ form_data.get('phone', '') }}"
            placeholder="010-0000-0000"
            autocomplete="tel"
            required
        >
    </div>

    <button class="button button--primary" type="submit">
        이메일 찾기
    </button>
</form>

{% if found_email %}
    <div class="result-box" role="status">
        <p>가입한 이메일</p>
        <strong>{{ found_email }}</strong>
    </div>
{% endif %}

            <div class="page-links">
                <a href="{{ url_for('auth.login') }}">로그인으로 돌아가기</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
