{% extends "base.html" %}

{% block title %}비밀번호 찾기 | TripPalette{% endblock %}

{% block content %}
<div class="page-section">
    <div class="container">
        <h1 class="page-title">비밀번호 찾기</h1>

        <div class="content">
            <p>가입할 때 입력한 회원정보와 새 비밀번호를 입력해주세요.</p>
        <form method="post" action="{{ url_for('auth.reset_password') }}">
    <div class="form-group">
        <label for="email">이메일</label>
        <input
            type="email"
            id="email"
            name="email"
            value="{{ form_data.get('email', '') }}"
            placeholder="가입한 이메일"
            autocomplete="email"
            required
        >
    </div>

    <div class="form-group">
        <label for="name">이름</label>
        <input
            type="text"
            id="name"
            name="name"
            value="{{ form_data.get('name', '') }}"
            placeholder="가입한 이름"
            autocomplete="name"
            required
        >
    </div>

    <div class="form-group">
        <label for="phone">휴대폰 번호</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            value="{{ form_data.get('phone', '') }}"
            placeholder="010-0000-0000"
            autocomplete="tel"
            required
        >
    </div>

    <div class="form-group">
        <label for="password">새 비밀번호</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            placeholder="8자 이상 입력해주세요"
            autocomplete="new-password"
            required
        >
    </div>

    <div class="form-group">
        <label for="password-confirm">새 비밀번호 확인</label>
        <input
            type="password"
            id="password-confirm"
            name="password_confirm"
            minlength="8"
            placeholder="새 비밀번호를 다시 입력해주세요"
            autocomplete="new-password"
            required
        >
    </div>

    <button class="button button--primary" type="submit">
        비밀번호 변경
    </button>
</form>

            <div class="page-links">
                <a href="{{ url_for('auth.login') }}">로그인으로 돌아가기</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
