{% extends "base.html" %}

{% block title %}회원가입 | TripPalette{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-signup-page">
    <div class="container auth-signup-container">
        <section class="auth-signup-card" aria-labelledby="signup-title">
            <h1 id="signup-title">회원가입</h1>

            <form class="auth-signup-form" method="post" action="{{ url_for('auth.signup') }}">
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" value="{{ form_data.get('email', '') }}" placeholder="이메일을 입력해주세요" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" minlength="8" placeholder="8자 이상 입력해주세요" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="password-confirm">비밀번호 확인</label>
                    <input type="password" id="password-confirm" name="password_confirm" minlength="8" placeholder="비밀번호를 다시 입력해주세요" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" value="{{ form_data.get('name', '') }}" placeholder="이름을 입력해주세요" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="phone">휴대폰 번호</label>
                    <input type="tel" id="phone" name="phone" value="{{ form_data.get('phone', '') }}" placeholder="010-0000-0000" autocomplete="tel" required>
                </div>

                <button class="button auth-signup-submit" type="submit">회원가입</button>
            </form>

            <div class="auth-signup-login">
                <span>이미 회원이신가요?</span>
                <a href="{{ url_for('auth.login') }}">로그인</a>
            </div>
        </section>
    </div>
</div>
{% endblock %}
