
{% extends "base.html" %}

{% block title %}결제 준비 중 | TripPalette{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/reservation.css') }}">
{% endblock %}

{% block content %}
<section class="reservation-complete-page">
    <div class="reservation-complete-card">
        <span class="reservation-kicker">결제 안내</span>
        <h1>결제 기능은<br>현재 준비 중입니다.</h1>
        <p>{{ reservation.accommodation.name }} 예약은 대기 상태로 안전하게 저장되어 있습니다.</p>
        <div class="reservation-complete-card__actions">
            <a href="{{ url_for('mypage.reservations') }}">예약 내역 보기</a>
        </div>
    </div>
</section>
{% endblock %}
