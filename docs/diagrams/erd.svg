  <text x="638" y="213" class="field"><tspan class="key">PK</tspan> id</text><text x="638" y="236" class="field">name · region</text><text x="638" y="259" class="field">season · purpose · atmosphere</text><text x="638" y="282" class="field">budget_level · recommended_days</text><text x="638" y="305" class="field">description · image_url</text>

