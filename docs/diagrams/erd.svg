  <text x="58" y="213" class="field"><tspan class="key">PK</tspan> id</text><text x="58" y="236" class="field"><tspan class="key">UQ</tspan> email</text><text x="58" y="259" class="field">password_hash · name · phone</text><text x="58" y="282" class="field">withdrawal_requested_at</text><text x="58" y="305" class="field">scheduled_deletion_at</text><text x="58" y="328" class="field"><tspan class="key">UQ</tspan> payment_customer_key</text><text x="58" y="351" class="field">created_at</text>

  <g filter="url(#shadow)"><rect class="card" x="340" y="135" width="250" height="220" rx="15" stroke="#4b86c2"/><path d="M340 150a15 15 0 0 1 15-15h220a15 15 0 0 1 15 15v38H340z" fill="#4b86c2"/></g>
