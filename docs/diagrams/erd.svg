    <style>
      text{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;fill:#17243a}.title{font-size:46px;font-weight:800;fill:#153f75}.subtitle{font-size:21px;font-weight:600;fill:#516a83}.entity{font-size:20px;font-weight:800;fill:#fff}.field{font-size:12.5px;font-weight:600}.key{font-size:12px;font-weight:800}.rel{fill:none;stroke-width:2.5}.rel-blue{stroke:#4b86c2}.rel-teal{stroke:#45958d}.rel-purple{stroke:#806fbd}.rel-orange{stroke:#d18452}.rel-gray{stroke:#778596}.card{fill:#fff;stroke-width:2}.note{font-size:13px;font-weight:700;fill:#4d6177}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
