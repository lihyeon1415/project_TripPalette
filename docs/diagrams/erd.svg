  <text x="358" y="213" class="field"><tspan class="key">PK</tspan> id</text><text x="358" y="236" class="field"><tspan class="key">FK·UQ</tspan> user_id</text><text x="358" y="259" class="field">season · companion · purpose</text><text x="358" y="282" class="field">atmosphere · budget</text><text x="358" y="305" class="field">trip_duration</text><text x="358" y="328" class="field">updated_at</text>

