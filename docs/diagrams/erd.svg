  <text x="928" y="213" class="field"><tspan class="key">PK</tspan> id</text><text x="928" y="236" class="field"><tspan class="key">FK</tspan> destination_id</text><text x="928" y="259" class="field">name · address</text><text x="928" y="282" class="field">price_per_night · capacity</text><text x="928" y="305" class="field">rating · description</text><text x="928" y="328" class="field">image_url</text>

  <g filter="url(#shadow)"><rect class="card" x="1210" y="135" width="300" height="235" rx="15" stroke="#806fbd"/><path d="M1210 150a15 15 0 0 1 15-15h270a15 15 0 0 1 15 15v38h-300z" fill="#806fbd"/></g>
