  <text x="1228" y="213" class="field"><tspan class="key">PK</tspan> id</text><text x="1228" y="236" class="field"><tspan class="key">FK</tspan> user_id · accommodation_id</text><text x="1228" y="259" class="field">check_in · check_out · people_count</text><text x="1228" y="282" class="field">total_price · status</text><text x="1228" y="305" class="field">created_at · expires_at</text><text x="1228" y="328" class="field">PAYMENT_PENDING → CONFIRMED</text>

  <g filter="url(#shadow)"><rect class="card" x="1540" y="120" width="340" height="300" rx="15" stroke="#778596"/><path d="M1540 135a15 15 0 0 1 15-15h310a15 15 0 0 1 15 15v38h-340z" fill="#5d6b7b"/></g>
  <text x="1558" y="154" class="entity">Payment</text><text x="1862" y="154" class="entity" text-anchor="end">공통 결제</text>
  <text x="1558" y="198" class="field"><tspan class="key">PK</tspan> id</text><text x="1558" y="221" class="field"><tspan class="key">FK·UQ</tspan> reservation_id (nullable)</text><text x="1558" y="244" class="field"><tspan class="key">FK·UQ</tspan> goods_order_id (nullable)</text><text x="1558" y="267" class="field"><tspan class="key">UQ</tspan> merchant_order_id · payment_key</text><text x="1558" y="290" class="field">provider · amount · payment_method</text><text x="1558" y="313" class="field">payment_status · idempotency_key</text><text x="1558" y="336" class="field">requested_at · paid_at · cancelled_at</text><text x="1558" y="359" class="field">failure_code · failure_message</text><text x="1558" y="388" class="note">예약 또는 굿즈 주문 중 정확히 하나만 연결(XOR)</text>

  <!-- 중단: 상호작용 -->
  <g filter="url(#shadow)"><rect class="card" x="60" y="450" width="220" height="185" rx="15" stroke="#65a38a"/><path d="M60 465a15 15 0 0 1 15-15h190a15 15 0 0 1 15 15v36H60z" fill="#65a38a"/></g>
  <text x="78" y="482" class="entity">Favorite</text><text x="262" y="482" class="entity" text-anchor="end">찜</text><text x="78" y="525" class="field"><tspan class="key">PK</tspan> id</text><text x="78" y="548" class="field"><tspan class="key">FK</tspan> user_id</text><text x="78" y="571" class="field"><tspan class="key">FK</tspan> destination_id</text><text x="78" y="594" class="field">created_at</text><text x="78" y="617" class="field"><tspan class="key">UQ</tspan> user + destination</text>

  <g filter="url(#shadow)"><rect class="card" x="350" y="450" width="230" height="185" rx="15" stroke="#65a38a"/><path d="M350 465a15 15 0 0 1 15-15h200a15 15 0 0 1 15 15v36H350z" fill="#65a38a"/></g>
  <text x="368" y="482" class="entity">Review</text><text x="562" y="482" class="entity" text-anchor="end">여행지 리뷰</text><text x="368" y="525" class="field"><tspan class="key">PK</tspan> id</text><text x="368" y="548" class="field"><tspan class="key">FK</tspan> user_id · destination_id</text><text x="368" y="571" class="field">rating · content</text><text x="368" y="594" class="field">created_at</text><text x="368" y="617" class="field"><tspan class="key">UQ</tspan> user + destination</text>

  <g filter="url(#shadow)"><rect class="card" x="660" y="450" width="280" height="185" rx="15" stroke="#65a38a"/><path d="M660 465a15 15 0 0 1 15-15h250a15 15 0 0 1 15 15v36H660z" fill="#65a38a"/></g>
  <text x="678" y="482" class="entity" font-size="18">AccommodationReview</text><text x="678" y="525" class="field"><tspan class="key">PK</tspan> id</text><text x="678" y="548" class="field"><tspan class="key">FK</tspan> user_id · accommodation_id</text><text x="678" y="571" class="field">rating · content</text><text x="678" y="594" class="field">created_at</text><text x="678" y="617" class="field"><tspan class="key">UQ</tspan> user + accommodation</text>

  <!-- 하단: 굿즈 -->
  <g filter="url(#shadow)"><rect class="card" x="40" y="720" width="270" height="290" rx="15" stroke="#d18452"/><path d="M40 735a15 15 0 0 1 15-15h240a15 15 0 0 1 15 15v38H40z" fill="#d18452"/></g>
  <text x="58" y="754" class="entity">Product</text><text x="292" y="754" class="entity" text-anchor="end">상품</text><text x="58" y="798" class="field"><tspan class="key">PK</tspan> id</text><text x="58" y="821" class="field"><tspan class="key">UQ</tspan> sku</text><text x="58" y="844" class="field">name · description</text><text x="58" y="867" class="field">price · stock_quantity</text><text x="58" y="890" class="field">thumbnail_url · is_active</text><text x="58" y="913" class="field">created_at · updated_at</text>

  <g filter="url(#shadow)"><rect class="card" x="330" y="720" width="220" height="200" rx="15" stroke="#d18452"/><path d="M330 735a15 15 0 0 1 15-15h190a15 15 0 0 1 15 15v38H330z" fill="#d18452"/></g>
  <text x="348" y="754" class="entity" font-size="17">ProductCategory</text><text x="348" y="798" class="field"><tspan class="key">PK</tspan> id</text><text x="348" y="821" class="field"><tspan class="key">FK</tspan> product_id</text><text x="348" y="844" class="field">category</text><text x="348" y="867" class="field"><tspan class="key">UQ</tspan> product + category</text>

  <g filter="url(#shadow)"><rect class="card" x="580" y="720" width="220" height="200" rx="15" stroke="#d18452"/><path d="M580 735a15 15 0 0 1 15-15h190a15 15 0 0 1 15 15v38H580z" fill="#d18452"/></g>
  <text x="598" y="754" class="entity" font-size="18">ProductImage</text><text x="598" y="798" class="field"><tspan class="key">PK</tspan> id</text><text x="598" y="821" class="field"><tspan class="key">FK</tspan> product_id</text><text x="598" y="844" class="field">image_url · sort_order</text><text x="598" y="867" class="field"><tspan class="key">UQ</tspan> product + sort_order</text>

  <g filter="url(#shadow)"><rect class="card" x="830" y="720" width="250" height="220" rx="15" stroke="#d18452"/><path d="M830 735a15 15 0 0 1 15-15h220a15 15 0 0 1 15 15v38H830z" fill="#d18452"/></g>
  <text x="848" y="754" class="entity">CartItem</text><text x="1062" y="754" class="entity" text-anchor="end">장바구니</text><text x="848" y="798" class="field"><tspan class="key">PK</tspan> id</text><text x="848" y="821" class="field"><tspan class="key">FK</tspan> user_id · product_id</text><text x="848" y="844" class="field">quantity</text><text x="848" y="867" class="field">created_at · updated_at</text><text x="848" y="890" class="field"><tspan class="key">UQ</tspan> user + product</text>

  <g filter="url(#shadow)"><rect class="card" x="1100" y="720" width="350" height="290" rx="15" stroke="#c86e43"/><path d="M1100 735a15 15 0 0 1 15-15h320a15 15 0 0 1 15 15v38h-350z" fill="#c86e43"/></g>
  <text x="1118" y="754" class="entity">GoodsOrder</text><text x="1432" y="754" class="entity" text-anchor="end">굿즈 주문</text><text x="1118" y="798" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">UQ</tspan> order_number</text><text x="1118" y="821" class="field"><tspan class="key">FK</tspan> user_id (nullable)</text><text x="1118" y="844" class="field">recipient_name · recipient_phone · postal_code</text><text x="1118" y="867" class="field">address · address_detail · delivery_request</text><text x="1118" y="890" class="field">items_amount · shipping_fee · total_amount</text><text x="1118" y="913" class="field">status · expires_at · created_at</text><text x="1118" y="936" class="field">paid_at · cancelled_at · hidden_at</text>

  <g filter="url(#shadow)"><rect class="card" x="1480" y="720" width="380" height="270" rx="15" stroke="#c86e43"/><path d="M1480 735a15 15 0 0 1 15-15h350a15 15 0 0 1 15 15v38h-380z" fill="#c86e43"/></g>
  <text x="1498" y="754" class="entity">GoodsOrderItem</text><text x="1842" y="754" class="entity" text-anchor="end">주문 항목</text><text x="1498" y="798" class="field"><tspan class="key">PK</tspan> id</text><text x="1498" y="821" class="field"><tspan class="key">FK</tspan> goods_order_id · product_id</text><text x="1498" y="844" class="field">product_name · sku</text><text x="1498" y="867" class="field">unit_price · quantity · subtotal</text><text x="1498" y="890" class="field">주문 시점의 상품명·SKU·가격 보존</text>

  <rect x="990" y="450" width="890" height="185" rx="18" fill="#f8fafc" stroke="#c7d0da" stroke-width="2"/>
  <text x="1020" y="485" font-size="20" font-weight="800" fill="#46586c">관계·무결성 요약</text>
  <text x="1020" y="520" class="note">• 회원은 취향 1개, 찜·리뷰·예약·장바구니·주문 여러 개를 가질 수 있음</text>
  <text x="1020" y="550" class="note">• 여행지는 숙소·찜·여행지 리뷰와 연결되고, 숙소는 예약·숙소 리뷰와 연결됨</text>
  <text x="1020" y="580" class="note">• 상품은 분류·이미지·장바구니·주문 항목과 연결되며 SKU로 Seed Upsert</text>
  <text x="1020" y="610" class="note">• Payment는 예약 또는 굿즈 주문 하나만 참조하고 주문번호·결제키·멱등키는 유일함</text>

  <text x="1858" y="1045" class="note" text-anchor="end">PK 기본키 · FK 외래키 · UQ 유일 제약 · 2026-10 현재 구현 기준</text>
</svg>
