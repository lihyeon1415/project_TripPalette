  <g filter="url(#shadow)"><rect class="card" x="40" y="135" width="270" height="247" rx="15" stroke="#4b86c2"/><path d="M40 150a15 15 0 0 1 15-15h240a15 15 0 0 1 15 15v38H40z" fill="#4b86c2"/></g>
